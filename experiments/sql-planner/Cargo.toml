[workspace]
resolver = "3"

[package]
name = "lattice-sql-planner-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[features]
default = []
fault-hooks = []
parser = ["dep:sqlparser"]
datafusion = ["parser", "dep:datafusion", "dep:tokio", "dep:futures", "dep:async-trait"]

[dependencies]
lattice-core = { path = "../../crates/lattice-core" }
lattice-engines = { path = "../../crates/lattice-engines", default-features = false, features = ["row"] }
lattice-seams = { path = "../../crates/lattice-seams" }
lattice-sim = { path = "../../crates/lattice-sim" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sqlparser = { version = "=0.63.0", optional = true, default-features = false, features = ["std"] }
datafusion = { version = "=55.2.0", optional = true, default-features = false, features = ["sql"] }
tokio = { version = "=1.52.3", optional = true, default-features = false, features = ["rt", "time", "sync"] }
futures = { version = "=0.3.32", optional = true, default-features = false, features = ["executor"] }
async-trait = { version = "=0.1.89", optional = true }

[profile.release]
debug = "line-tables-only"

[lints.rust]
unsafe_code = "forbid"

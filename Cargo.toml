[workspace]
resolver = "3"
members = [
    "crates/lattice-sys",
    "crates/lattice-abi",
    "crates/lattice-seams",
    "crates/lattice-lsl",
    "crates/lattice-sim",
    "crates/lattice-sql",
    "crates/lattice-core",
    "crates/lattice-engines",
    "crates/lattice-identity",
    "crates/lattice-service",
    "crates/lattice-packs",
    "crates/lattice-intel",
    "crates/lattice-api",
    "crates/lattice-sdk",
    "crates/lattice-cli",
    "crates/lattice-testkit",
    "crates/lattice-evalkit",
    "crates/lattice-bench",
    "crates/latticed",
    "xtask",
]

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
repository = "https://github.com/moncifem/latticedb"

[workspace.dependencies]
toml = "1.1.8"
serde_json = "1.0.154"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
debug = "line-tables-only"
lto = "thin"
codegen-units = 1

# Simulated storage and invariant scans run in ordinary cargo tests. Optimize the workspace
# code as well as its dependencies, while preserving the debug safety checks.
[profile.test]
opt-level = 1
debug-assertions = true
overflow-checks = true

[profile.dev.package."*"]
opt-level = 1

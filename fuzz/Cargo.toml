[package]
name = "lattice-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
lattice-engines = { path = "../crates/lattice-engines", default-features = false, features = ["row"] }
libfuzzer-sys = "0.4"
lattice-core = { path = "../crates/lattice-core" }
lattice-lsl = { path = "../crates/lattice-lsl" }
lattice-abi = { path = "../crates/lattice-abi" }
lattice-seams = { path = "../crates/lattice-seams" }
lattice-sim = { path = "../crates/lattice-sim" }
lattice-api = { path = "../crates/lattice-api" }
lattice-sql = { path = "../crates/lattice-sql" }
lattice-sdk = { path = "../crates/lattice-sdk" }

# Not part of the main workspace: fuzzing needs nightly.
[workspace]

[[bin]]
name = "trivial"
path = "fuzz_targets/trivial.rs"
test = false
doc = false
bench = false


# libFuzzer limits for the scheduled fuzz runs (nightly.yml, weekly.yml, fuzz-24h.yml).
#
# Every `fuzz run` passes `python3 tools/check_fuzz_matrices.py flags <target>`, which prints
# `-timeout=N -rss_limit_mb=N -max_len=N` from this file. The pull request gate
# (`tools/check_fuzz_matrices.py`) fails when a fuzz target has no entry, when an entry has no
# `basis`, or when a workflow runs `fuzz run` without these flags.
#
# libFuzzer defaults, for comparison: -timeout is 1200 s per input (longer than the 600 s nightly
# run, so a hang could never be reported) and -max_len is 4096 bytes (below most decoder limits, so
# the over-limit branches were reachable only from unit tests).

[defaults]
# One input that takes longer than this is reported as a timeout artifact. This is a choice, not a
# measured figure: no scheduled run has recorded the slowest honest input under the sanitizer.
timeout_secs = 20
rss_limit_mb = 2048

# max_len is the largest accepted input of the decoder plus a little slack, so the over-limit and
# trailing-byte branches can be reached by generated bytes. Where a codec accepts more than 1 MiB
# (a 16 MiB record or value), the cap stays near 1 MiB: libFuzzer then reaches the over-limit
# branches through a length field that claims more bytes than follow, not through a payload that
# large. A cap of 4 MiB is the most the checker accepts.

[targets.changeset_decode]
max_len = 65536
basis = "no byte cap in the codec; 64 KiB crosses the 16-bit length boundaries"

[targets.id_parse]
max_len = 128
basis = "an id is 26 characters; 128 bytes holds 26 four-byte characters and a few over-long inputs"

[targets.log_open]
max_len = 262144
basis = "written as one WAL segment; records are capped at 16 MiB and segments at 1 MiB, so 256 KiB reaches multi-record segments and a truncated tail"

[targets.lsl_parse]
max_len = 1048640
basis = "MAX_SCHEMA_BYTES is 1 MiB (lattice-lsl parser) plus slack for the over-limit branch"

[targets.pgwire]
max_len = 1048640
basis = "MAX_MESSAGE_LEN is 1 MiB (lattice-api pgwire) plus slack for the over-limit branch"

[targets.sql_parse]
max_len = 1048640
basis = "MAX_INPUT_LEN is 1 MiB (lattice-sql) plus slack for the over-limit branch"

[targets.wal_record]
max_len = 1048640
basis = "record payloads are capped at 16 MiB; 1 MiB plus a header reaches the length checks, the over-limit branch comes from a length field"

[targets.row_ops]
max_len = 65536
basis = "no byte cap in the codec; counts are bounded by the input length"

[targets.catalog_decode]
max_len = 65536
basis = "names are capped at 255 bytes and index operations at 4096 (lattice-engines catalog); no byte cap and no measured largest payload, 64 KiB is a choice that reaches many entries"

[targets.typed_row_decode]
max_len = 65536
basis = "nesting is capped at depth 16; no byte cap, 64 KiB covers lists and long text cells"

[targets.sqldef_decode]
max_len = 131200
basis = "a definition body is capped at 64 KiB and a block holds up to 1024 of them; two maximal bodies in one block take 4 + 2 * (9 + 65,536) bytes plus the selector byte (131,095), so 131,200 reaches the body cap, its over-limit branch and a block of two maximal bodies, with no measured largest input; a selector of 2 decodes a whole LCIX envelope, whose definition block is the same size class"

[targets.sync_frame]
max_len = 1048640
basis = "HEADER_LEN plus MAX_PAYLOAD is 1 MiB + 5 (lattice-api sync) plus slack for the over-limit branch"

[targets.plugin_jsonl]
max_len = 1048640
basis = "MAX_LINE_BYTES is 1 MiB (lattice-sdk contract) plus slack for the over-limit branch"

[targets.feed_decode]
max_len = 1048640
basis = "values are capped at 16 MiB (lattice-core feed); 1 MiB reaches large values, the over-limit branch comes from a length field"

[targets.mcp_message]
max_len = 262208
basis = "MAX_MESSAGE_BYTES is 256 KiB (lattice-sdk mcp) plus slack for the over-limit branch"

[targets.outbox_decode]
max_len = 1048640
basis = "a stored queue is capped at 32 MiB (lattice-sdk outbox); 1 MiB reaches many records, the over-limit branch comes from a length field"

[targets.crdt_text_decode]
max_len = 1280
basis = "MAX_ENCODED_LEN is 1065 bytes (lattice-core crdt_text) plus slack for trailing bytes"

[targets.crdt_tree_decode]
max_len = 64
basis = "an operation is exactly 41 bytes (lattice-core crdt_tree) plus slack for trailing bytes"

[targets.conflict_decode]
max_len = 16384
basis = "at most 16 proposals with names of at most 64 bytes, far below 16 KiB, plus room for trailing bytes"

[targets.websocket_frame]
max_len = 1048640
basis = "the test decodes frames with a 1 MiB payload cap plus a 14-byte header (lattice-api websocket) plus slack"

[targets.bearer_verify]
max_len = 4096
basis = "the input is a header (only 128 bytes are looked at) and a credential file; 4 KiB holds the header limit, many entries and the over-limit branches (the 256 KiB file cap is reached by unit tests)"

[targets.scram_exchange]
max_len = 16384
basis = "a SASL body is at most 8 KiB (MAX_SASL_BODY_LEN, lattice-api pgwire); 16 KiB holds two maximal frames back to back, a third truncated frame and the leading control byte"

[targets.credential_file]
max_len = 262208
basis = "MAX_CREDENTIAL_BYTES is 256 KiB (lattice-api auth) plus slack, so the over-limit branch is reachable by the input length itself"

[targets.tls_pem]
max_len = 83968
basis = "TlsConfig::from_pem refuses a chain over 65536 bytes and a key over 16384 bytes (crates/latticed/src/transport.rs); 82 KiB plus the NUL separator reaches both over-limit branches"

[targets.subscribe_host]
max_len = 16384
basis = "a scope is at most 512 bytes and a cursor at most 64 (MAX_SCOPE_LEN and MAX_CURSOR_LEN, lattice-proto sync), so one subscribe frame is under 600 bytes; 16 KiB holds a session of dozens of frames, an over-long scope and a truncated frame"

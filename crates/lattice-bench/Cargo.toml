[package]
name = "lattice-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Benchmarks with stored baselines and a regression gate."

[dependencies]
lattice-abi = { path = "../lattice-abi" }
lattice-seams = { path = "../lattice-seams" }
lattice-sim = { path = "../lattice-sim" }
lattice-lsl = { path = "../lattice-lsl" }
lattice-core = { path = "../lattice-core" }
serde_json.workspace = true

[dev-dependencies]
lattice-testkit = { path = "../lattice-testkit" }
lattice-engines = { path = "../lattice-engines", default-features = false, features = ["row"] }
lattice-api = { path = "../lattice-api" }

[features]
default = []
runtime-spike = ["dep:tokio", "lattice-seams/uring"]

[target.'cfg(target_os = "linux")'.dependencies]
tokio = { version = "1", optional = true, default-features = false, features = ["rt", "fs", "io-util"] }

[[bin]]
name = "runtime_probe"
path = "src/bin/runtime_probe.rs"
required-features = ["runtime-spike"]

[lints]
workspace = true

[[example]]
name = "row_bench"
path = "examples/row_bench.rs"
test = true

[[example]]
name = "row_fault_runner"
path = "examples/row_fault_runner.rs"
test = true

[[example]]
name = "phase3_bench"
path = "examples/phase3_bench.rs"
test = true

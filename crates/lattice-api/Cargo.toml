[package]
name = "lattice-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Protocol front doors: PG wire, S3, sync, OIDC endpoints, MCP, gRPC."

[dependencies]
lattice-abi = { path = "../lattice-abi" }
lattice-seams = { path = "../lattice-seams" }
lattice-core = { path = "../lattice-core" }
lattice-engines = { path = "../lattice-engines" }
lattice-identity = { path = "../lattice-identity" }
lattice-service = { path = "../lattice-service" }
lattice-packs = { path = "../lattice-packs" }
lattice-lsl = { path = "../lattice-lsl" }

# SCRAM-SHA-256 uses maintained primitives; no ambient randomness is enabled.
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
hmac = { version = "=0.13.0", default-features = false, features = ["zeroize"] }
pbkdf2 = { version = "=0.13.0", default-features = false, features = ["hmac"] }
sha2 = { version = "=0.11.1", default-features = false, features = ["zeroize"] }
subtle = { version = "=2.6.1", default-features = false }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }

[dev-dependencies]
proptest = "1.12.0"

[lints]
workspace = true

[package]
name = "lattice-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "The only crate allowed to contain unsafe code (io_uring, mmap wrappers)."

[dependencies]

# lattice-sys cannot inherit the workspace table (it must not forbid unsafe), so the shared
# discipline is repeated here. Keep in sync with [workspace.lints].
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"

[package]
name = "latticed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Composition root: wires implementations to traits and runs the server."

[dependencies]
lattice-abi = { path = "../lattice-abi" }
lattice-seams = { path = "../lattice-seams" }
lattice-sys = { path = "../lattice-sys" }
lattice-core = { path = "../lattice-core" }
lattice-engines = { path = "../lattice-engines" }
lattice-identity = { path = "../lattice-identity" }
lattice-service = { path = "../lattice-service" }
lattice-packs = { path = "../lattice-packs" }
lattice-api = { path = "../lattice-api" }

lattice-intel = { path = "../lattice-intel", optional = true }

[features]
default = []
intel = ["dep:lattice-intel"]

[lints]
workspace = true

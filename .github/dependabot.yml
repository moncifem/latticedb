version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: cargo
    directory: /fuzz
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: cargo
    directory: /tools/cancel-loom
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: cargo
    directory: /experiments/sql-planner
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      sql-planner-engine:
        patterns: ["datafusion*", "sqlparser*"]
  - package-ecosystem: cargo
    directory: /experiments/sql-planner/bridge-baseline
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      artifact-actions:
        patterns: ["actions/upload-artifact", "actions/download-artifact"]
  - package-ecosystem: pip
    directory: /.github
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: pip
    directory: /tools
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      sql-planner-pins:
        patterns: ["psycopg*", "typing-extensions"]
  - package-ecosystem: npm
    directory: /clients/typescript
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
  - package-ecosystem: npm
    directory: /tests/drivers/node
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      driver-smoke:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /tests/drivers/go
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      driver-smoke:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /tests/drivers/python
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      driver-smoke:
        patterns: ["*"]
  - package-ecosystem: maven
    directory: /tests/drivers/jdbc
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      driver-smoke:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /tests/drivers/tokio
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
    groups:
      driver-smoke:
        patterns: ["*"]

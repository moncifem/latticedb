name: weekly
on:
  schedule: [{ cron: "0 3 * * 0" }]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  long-fuzz:
    strategy:
      fail-fast: false
      matrix:
        target: [changeset_decode, id_parse, log_open, lsl_parse, wal_record]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: nightly }
      - uses: taiki-e/install-action@645d1ab48b3cb8591684a8b730b2ccf4cb3f9568 # v2
        with: { tool: cargo-fuzz }
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: fuzz ${{ matrix.target }} for 5 hours (the corpus carries over between weeks)
        run: cd fuzz && cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=18000
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: 1.99.1 }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@645d1ab48b3cb8591684a8b730b2ccf4cb3f9568 # v2
        with: { tool: cargo-mutants }
      - name: mutation testing of crates whose tests live in other crates (a surviving mutant fails the run)
        run: >
          cargo mutants -p lattice-core -p lattice-lsl --test-workspace=true
          --timeout 120 --no-shuffle -j 2 --output target/mutants
      - if: always()
        name: mutation testing of crates with their own tests (a surviving mutant fails the run)
        run: >
          cargo mutants -p lattice-abi -p lattice-evalkit -p lattice-sim -p lattice-seams
          -p lattice-cli -p lattice-bench -p lattice-sdk --test-workspace=false
          --timeout 120 --no-shuffle -j 2 --output target/mutants-crates
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants
          path: |
            target/mutants/mutants.out
            target/mutants-crates/mutants.out
          if-no-files-found: ignore
  io-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: 1.99.1 }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: commit path on the runner's disk
        run: cargo run -q --release -p lattice-bench --bin io_probe -- --commits 2000 | tee io-probe.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: io-probe
          path: io-probe.txt

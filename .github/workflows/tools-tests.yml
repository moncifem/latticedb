name: tools-tests
# Runs the unit tests of the Python tools under tools/, of the board console under
# integrations/console/ and of the board helper's orchestration rules under integrations/board/tests
# (an executable model, plus the shell helper driven against a fake psql), of `board run` (the worker
# runner, against a fake board helper and fake agents, with planted faults that the tests must catch),
# of the swarm's invariant checker, and the commands named in docs/quickstart-agents.md. The tests use
# PATH shims for git, gh and psql, so they need no network, no token and no database. Tests that need a
# built lattice-cli skip themselves. integrations/board/test.sh and the swarm itself need a latticed;
# the dev-stack job runs them. The board MCP server (board-mcp) and the plugin files are tested here too,
# against a fake helper, with planted faults; `claude plugin validate` needs the CLI and is not run here.
# board bench (integrations/board/board-bench, benchlib, the Experiments screen of the console) is tested here with
# statistics checked against hand-computed values, real attempts with fake agents, `board run --after-cmd`, the
# helper's bench SQL against a fake psql, and a copy of the code with one planted fault at a time (about three
# minutes in all, mostly the mutation copies). tests/bench_devstack.py runs in the dev-stack job.
on:
  pull_request:
    paths:
      - "tools/**"
      - "integrations/console/**"
      - "integrations/board/**"
      - "docs/quickstart-agents.md"
      - ".claude-plugin/**"
      - ".github/workflows/**"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tools-tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  tools-tests:
    name: tools-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Run the tools unit tests
        run: python3 -m unittest discover -s tools -p "test_*.py"
      - name: Run the board console unit tests
        run: python3 -m unittest discover -s integrations/console/tests -p "test_*.py"
      - name: Run the board orchestration tests
        run: python3 -m unittest discover -s integrations/board/tests -p "test_*.py"

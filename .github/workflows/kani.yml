name: kani
# Bounded model checking with Kani. Heavy, so it runs weekly and on demand, never on a pull request.
# Job `verified` runs only the harnesses that completed on CI (docs/verification.md): a green run
# means those proofs ran and passed. Job `extended` runs the rest on manual dispatch with
# `extended: true`; those harnesses timed out or were killed on the hosted runner and are not proven.
# The unwind bound of every harness is recorded next to it with #[kani::unwind]; docs/verification.md
# lists what each proof covers and what it does not. The harnesses are in `proofs.rs` files beside the
# sources they check.
on:
  schedule: [{ cron: "0 4 * * 0" }]
  workflow_dispatch:
    inputs:
      extended:
        description: "also run the harnesses that are not yet proven (expected to fail or time out)"
        type: boolean
        default: false
permissions:
  contents: read
env:
  # 0.68.0 bundles nightly-2026-08-21. Kani builds with its own nightly, not with the pinned toolchain.
  KANI_VERSION: "0.68.0"
jobs:
  verified:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      # Only the compiled binaries are cached. `cargo kani setup` below is idempotent and fetches the
      # bundle and Kani's nightly, so a cache hit can never leave a half-installed toolchain.
      - name: cache the Kani binaries
        id: kani-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/bin/cargo-kani
            ~/.cargo/bin/kani
          key: kani-bin-${{ env.KANI_VERSION }}-${{ runner.os }}
      - name: install kani-verifier ${{ env.KANI_VERSION }}
        if: steps.kani-cache.outputs.cache-hit != 'true'
        run: cargo install --locked kani-verifier --version "${KANI_VERSION}"
      - name: check the Kani version
        run: |
          cargo kani --version
          cargo kani --version | grep -Fq "Kani Rust Verifier ${KANI_VERSION} "
      - name: set up Kani
        run: cargo kani setup
      # Kani's nightly may report a rustc older than the workspace rust-version (1.99.1), which cargo
      # refuses. Relax the field in this throwaway checkout only; no other build is affected.
      - name: relax rust-version for the proof build
        run: |
          rustc --version
          test "$(grep -c '^rust-version = ' Cargo.toml)" = 1
          sed -i 's/^rust-version = .*/rust-version = "1.85"/' Cargo.toml
          test "$(grep -c '^rust-version = "1.85"$' Cargo.toml)" = 1
      - name: prove lattice-core
        env:
          PACKAGE: lattice-core
        # An explicit shell is needed: the default `bash -e` has no pipefail, so a failed cargo kani
        # behind tee reported success in the first dispatch.
        shell: bash
        run: |
          mkdir -p kani-results
          cargo kani -Z unstable-options -p "${PACKAGE}" --harness cursor_round_trips --harness cursor_order_matches_lsn_index_and_bytes --harness cursor_decode_never_panics --harness event_decode_never_panics --harness-timeout 20m 2>&1 | tee "kani-results/${PACKAGE}.log"
          test "$(grep -c 'VERIFICATION:- SUCCESSFUL' "kani-results/${PACKAGE}.log")" = 4
          ! grep -q 'VERIFICATION:- FAILED' "kani-results/${PACKAGE}.log"
      # The log is the only record of which harness passed, failed or timed out; keep it even when the
      # proof step fails. A proof counts as passing only when this log says VERIFICATION:- SUCCESSFUL.
      - name: summarise the result
        if: always()
        env:
          PACKAGE: lattice-core
        run: |
          {
            echo "### kani ${PACKAGE} (${KANI_VERSION})"
            grep -E 'Checking harness|VERIFICATION:-|Complete - ' "kani-results/${PACKAGE}.log" || echo "no result lines; see the artifact"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: upload the proof log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kani-verified
          path: kani-results/
          retention-days: 30
          if-no-files-found: warn
  extended:
    if: github.event_name == 'workflow_dispatch' && inputs.extended
    strategy:
      fail-fast: false
      matrix:
        package: [lattice-core, lattice-api, lattice-sdk]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      # Only the compiled binaries are cached. `cargo kani setup` below is idempotent and fetches the
      # bundle and Kani's nightly, so a cache hit can never leave a half-installed toolchain.
      - name: cache the Kani binaries
        id: kani-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/bin/cargo-kani
            ~/.cargo/bin/kani
          key: kani-bin-${{ env.KANI_VERSION }}-${{ runner.os }}
      - name: install kani-verifier ${{ env.KANI_VERSION }}
        if: steps.kani-cache.outputs.cache-hit != 'true'
        run: cargo install --locked kani-verifier --version "${KANI_VERSION}"
      - name: check the Kani version
        run: |
          cargo kani --version
          cargo kani --version | grep -Fq "Kani Rust Verifier ${KANI_VERSION} "
      - name: set up Kani
        run: cargo kani setup
      # Kani's nightly may report a rustc older than the workspace rust-version (1.99.1), which cargo
      # refuses. Relax the field in this throwaway checkout only; no other build is affected.
      - name: relax rust-version for the proof build
        run: |
          rustc --version
          test "$(grep -c '^rust-version = ' Cargo.toml)" = 1
          sed -i 's/^rust-version = .*/rust-version = "1.85"/' Cargo.toml
          test "$(grep -c '^rust-version = "1.85"$' Cargo.toml)" = 1
      - name: prove ${{ matrix.package }}
        env:
          PACKAGE: ${{ matrix.package }}
        # An explicit shell is needed: the default `bash -e` has no pipefail, so a failed cargo kani
        # behind tee reported success in the first dispatch.
        shell: bash
        run: |
          mkdir -p kani-results
          cargo kani -Z unstable-options -p "${PACKAGE}" --harness-timeout 20m 2>&1 | tee "kani-results/${PACKAGE}.log"
          grep -q 'VERIFICATION:- SUCCESSFUL' "kani-results/${PACKAGE}.log"
          ! grep -q 'VERIFICATION:- FAILED' "kani-results/${PACKAGE}.log"
      # The log is the only record of which harness passed, failed or timed out; keep it even when the
      # proof step fails. A proof counts as passing only when this log says VERIFICATION:- SUCCESSFUL.
      - name: summarise the result
        if: always()
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          {
            echo "### kani ${PACKAGE} (${KANI_VERSION})"
            grep -E 'Checking harness|VERIFICATION:-|Complete - ' "kani-results/${PACKAGE}.log" || echo "no result lines; see the artifact"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: upload the proof log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kani-extended-${{ matrix.package }}
          path: kani-results/
          retention-days: 30
          if-no-files-found: warn

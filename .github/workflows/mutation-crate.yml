name: mutation-crate
# Manual package evidence only; filtered runs are diagnostics, never a global mutation score.
on:
  workflow_dispatch:
    inputs:
      package:
        description: crate to mutate, for example lattice-sql
        required: true
        default: lattice-sql
      filter_regex:
        description: Optional diagnostic mutant-name regex (empty selects the whole package)
        required: false
        default: ''
      max_shards:
        description: Maximum nonempty round-robin shards
        type: choice
        options: ['16', '8', '4', '2', '1']
        default: '16'
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: 1.99.1 }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { shared-key: mutation-crate }
      - uses: taiki-e/install-action@645d1ab48b3cb8591684a8b730b2ccf4cb3f9568 # v2
        with: { tool: cargo-mutants@27.1.0 }
      - name: Enumerate full package and verify selected assignments
        id: plan
        env:
          PACKAGE: ${{ inputs.package }}
          FILTER_REGEX: ${{ inputs.filter_regex }}
          MAX_SHARDS: ${{ inputs.max_shards }}
        run: |
          python3 -m unittest discover -s tools -p 'test_focused_mutation.py'
          python3 tools/focused_mutation.py plan --package="$PACKAGE" --regex="$FILTER_REGEX" \
            --maximum="$MAX_SHARDS" --output target/focused-plan
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: focused-mutation-plan
          path: target/focused-plan/
          if-no-files-found: error
          retention-days: 30
  mutation:
    needs: plan
    name: mutation (${{ inputs.package }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: 1.99.1 }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { shared-key: mutation-crate }
      - uses: taiki-e/install-action@645d1ab48b3cb8591684a8b730b2ccf4cb3f9568 # v2
        with: { tool: cargo-mutants@27.1.0 }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: focused-mutation-plan
          path: target/focused-plan
      - name: Verify selection, test package baseline, then mutate
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python3 tools/focused_mutation.py shard --plan target/focused-plan \
            --shard="$SHARD" --output target/focused-shard
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: focused-mutation-shard-${{ matrix.shard }}
          path: target/focused-shard/
          if-no-files-found: error
          retention-days: 30

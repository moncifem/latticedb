name: nightly-build
# Publishes the "nightly" pre-release and the :nightly image from main, once a day, only when main
# has moved since the last one and passes the full gate.
on:
  schedule: [{ cron: "0 4 * * *" }]
  workflow_dispatch:
permissions:
  contents: read
# The nightly release and image tag are replaced in place, so two runs must never overlap.
concurrency:
  group: publish-nightly
  cancel-in-progress: false
jobs:
  changed:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.c.outputs.build }}
      sha: ${{ steps.c.outputs.sha }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          last=$(gh release view nightly --repo "$REPO" --json targetCommitish --jq .targetCommitish 2>/dev/null || true)
          head=$(gh api "repos/$REPO/commits/main" --jq .sha)
          echo "sha=$head" >> "$GITHUB_OUTPUT"
          if [ "$last" = "$head" ] && [ "$EVENT" = schedule ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
  gate:
    needs: changed
    if: needs.changed.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ needs.changed.outputs.sha }}", persist-credentials: false }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: 1.99.1 }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@645d1ab48b3cb8591684a8b730b2ccf4cb3f9568 # v2.87.33
        with: { tool: cargo-deny@0.20.2 }
      - run: cargo xtask ci
        env: { CI: "true" }
  package:
    needs: [changed, gate]
    permissions:
      contents: write # replace the nightly pre-release and its assets
      packages: write # push the :nightly image to ghcr.io
      id-token: write # OIDC token for the build provenance attestation
      attestations: write # attest the nightly archives
    uses: ./.github/workflows/package.yml
    with:
      version: nightly
      channel: nightly
      publish: true
      ref: ${{ needs.changed.outputs.sha }}

  notify:
    # A failed scheduled run opens or comments on one issue for this workflow (scheduled-failure.yml).
    # Schedule runs only; a job cancelled by a lost runner counts, as it does in nightly's report.
    if: always() && github.event_name == 'schedule' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    needs: [changed, gate, package]
    permissions:
      contents: read
      actions: read
      issues: write
    uses: ./.github/workflows/scheduled-failure.yml
    with:
      workflow: ${{ github.workflow }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

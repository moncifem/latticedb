name: sql-reference

# Checks the sqllogictest scripts against PostgreSQL 17. This file is the only definition: it runs
# on pull requests that touch the scripts or the checker, by hand, and every night as a reusable
# workflow called from nightly.yml, so the pinned PostgreSQL digest, the service setup and the
# report artifact live in one place.
on:
  workflow_call:
  pull_request:
    paths:
      - crates/lattice-testkit/tests/slt/**
      - tools/slt_reference.py
      - tools/test_slt_reference.py
      - .github/workflows/sql-reference.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # In a called workflow github.workflow is the caller's name, so a nightly call never shares a
  # group with a pull request run; only a superseded pull request run is cancelled.
  group: sql-reference-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sql-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
        env: { POSTGRES_PASSWORD: ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: check the sqllogictest scripts against PostgreSQL 17
        shell: bash
        run: python3 tools/slt_reference.py crates/lattice-testkit/tests/slt/*.test 2>&1 | tee sql-reference-report.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sql-reference-report
          path: sql-reference-report.txt
          if-no-files-found: warn
          retention-days: 14

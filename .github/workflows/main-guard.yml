name: main-guard
on:
  workflow_run:
    workflows: [pr]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - 'tools/main_guard.py'
      - 'tools/test_main_guard.py'
      - 'tools/branch-protection.json'
      - '.github/workflows/main-guard.yml'
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed pr push/main run to evaluate
        required: true
        type: string
      dry_run:
        description: Read-only decision; publication also requires owner activation
        required: true
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: main-guard-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publisher' }}
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit and real-Git fake-GitHub fixture rehearsal
        run: python3 -m unittest discover -s tools -p 'test_main_guard.py'
  guard:
    needs: tests
    if: >-
      github.repository == 'moncifem/latticedb' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'failure'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    steps:
      # Immutable controller revision; no failing-run artifacts, shell text or PR code is executed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read-only evaluation of the verified run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: python3 tools/main_guard.py --repo "$REPO" --run-id "$RUN_ID" --dry-run
  publish:
    needs: [tests, guard]
    if: >-
      github.repository == 'moncifem/latticedb' &&
      vars.MAIN_GUARD_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.dry_run) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'failure'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate independently before each permitted publication mutation
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: python3 tools/main_guard.py --repo "$REPO" --run-id "$RUN_ID" --apply

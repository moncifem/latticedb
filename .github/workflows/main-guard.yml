name: main-guard
# When a push to main fails a required check, open a revert pull request and a tracking issue.
# It never pushes to main. The decision logic lives in tools/main_guard.py (unit tested).
on:
  workflow_run:
    workflows: [pr]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Run id of a finished pr workflow run on main to evaluate
        required: true
        type: string
      dry_run:
        description: Decide and print only; open nothing
        required: true
        type: boolean
        default: true
permissions:
  contents: write # the revert/<short-sha> branch only
  pull-requests: write
  issues: write
concurrency:
  group: main-guard
  cancel-in-progress: false
jobs:
  guard:
    name: guard
    # Only push runs on main that did not succeed. The script re-checks everything through the API.
    if: >-
      github.repository == 'moncifem/latticedb' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'failure'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Always the tooling from main, never the code of the failing commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: unit tests for the decision table
        run: python3 -m unittest discover -s tools -p 'test_main_guard.py'
      - name: evaluate the run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          flags=()
          if [ "$DRY_RUN" = "true" ]; then flags+=(--dry-run); fi
          python3 tools/main_guard.py --repo "$REPO" --run-id "$RUN_ID" "${flags[@]}"

name: nightly
on:
  schedule: [{ cron: "0 2 * * *" }]
  workflow_dispatch:
permissions:
  contents: read
env:
  CI: "true"
jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: 1.99.1 }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: simulation, all fault profiles (200,000 seeds each)
        run: cargo xtask sim --seeds 200000 --steps 150
      - name: planted-bug detection and determinism self-check
        run: cargo test -p lattice-testkit --release
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: nightly }
      - uses: taiki-e/install-action@645d1ab48b3cb8591684a8b730b2ccf4cb3f9568 # v2
        with: { tool: cargo-fuzz }
      - name: run the trivial fuzz target for 10 seconds
        run: cd fuzz && cargo +nightly fuzz run trivial -- -max_total_time=10
  loom-miri-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: echo "Phase 1 adds loom, Miri on lattice-sys, and sanitizer builds (scaffold)"
  bench-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: 1.99.1 }
      - run: cargo xtask check-config-formats
      - run: echo "Phase 1 adds benchmarks against baselines and eval suites (scaffold)"
  tlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: "21" }
      - name: fetch tla2tools and check every model
        run: |
          curl -sSL -o tla2tools.jar https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar
          TLA2TOOLS=$PWD/tla2tools.jar tla/check-all.sh

name: nightly
on:
  schedule: [{ cron: "0 2 * * *" }]
  workflow_dispatch:
permissions:
  contents: read
env:
  CI: "true"
jobs:
  sim:
    strategy:
      fail-fast: false
      matrix:
        profile: [clean, crash-heavy, disk-faulty, hostile, everything]
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: 1.99.1 }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: simulation, ${{ matrix.profile }}, 250,000 seeds (1,000,000 per profile across the shards)
        # The seed window moves every day, so a night never repeats the one before.
        run: |
          day=$(( $(date -u +%s) / 86400 ))
          from=$(( day * 1000000 + ${{ matrix.shard }} * 250000 ))
          echo "seeds $from to $(( from + 249999 ))"
          cargo run -q --release -p lattice-testkit --bin sim_runner -- \
            --seeds 250000 --steps 150 --from "$from" --profile ${{ matrix.profile }}
  determinism-and-planted-bugs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: 1.99.1 }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: planted-bug detection and determinism self-check
        run: cargo test -p lattice-testkit --release
      - name: determinism at gate volume (10,000 seeds per profile, each run twice)
        run: cargo test -p lattice-testkit --release --test clean_build -- --ignored
      - name: property tests at 1,000,000 cases (CRDT laws, codecs, clock)
        run: cargo test -p lattice-core -p lattice-abi -p lattice-lsl --release
        env:
          PROPTEST_CASES: "1000000"
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target: [changeset_decode, id_parse, log_open, lsl_parse, wal_record]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: nightly }
      - uses: taiki-e/install-action@645d1ab48b3cb8591684a8b730b2ccf4cb3f9568 # v2
        with: { tool: cargo-fuzz }
      - name: fuzz ${{ matrix.target }} for 10 minutes
        run: cd fuzz && cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=600
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
  config-formats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: 1.99.1 }
      - run: cargo xtask check-config-formats
  tlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: "21" }
      - name: fetch tla2tools 1.7.4 (checksum pinned) and check every model
        run: |
          curl -sSL -o tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  tla2tools.jar" | sha256sum --check
          TLA2TOOLS=$PWD/tla2tools.jar tla/check-all.sh

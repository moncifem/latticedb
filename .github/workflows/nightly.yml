name: nightly
on:
  schedule: [{ cron: "0 2 * * *" }]
  workflow_dispatch:
permissions:
  contents: read
env:
  CI: "true"
jobs:
  sim:
    strategy:
      fail-fast: false
      matrix:
        profile: [clean, crash-heavy, disk-faulty, hostile, everything]
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: 1.99.1 }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: simulation, ${{ matrix.profile }}, 250,000 seeds (1,000,000 per profile across the shards)
        # The seed window moves every day, so a night never repeats the one before.
        run: |
          day=$(( $(date -u +%s) / 86400 ))
          from=$(( day * 1000000 + ${{ matrix.shard }} * 250000 ))
          echo "seeds $from to $(( from + 249999 ))"
          mkdir -p target/evidence
          cargo run -q --release -p lattice-testkit --bin sim_runner -- \
            --seeds 250000 --steps 150 --from "$from" --profile ${{ matrix.profile }} --ledger target/evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          overwrite: true
          name: evidence-sim-${{ matrix.profile }}-${{ matrix.shard }}
          path: target/evidence/
          if-no-files-found: warn
  determinism-and-planted-bugs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: 1.99.1 }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: planted-bug detection and determinism self-check
        run: cargo test -p lattice-testkit --release
      - name: gate-volume tests (determinism over 10,000 seeds per profile; 100 exhaustively swept workloads)
        run: cargo test -p lattice-testkit --release --test clean_build --test power_cut_sweep -- --ignored
      - name: property tests at 1,000,000 cases (CRDT laws, codecs, clock)
        run: cargo test -p lattice-core -p lattice-abi -p lattice-lsl --release
        env:
          PROPTEST_CASES: "1000000"
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target: [changeset_decode, id_parse, log_open, lsl_parse, pgwire, wal_record]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: nightly }
      - uses: taiki-e/install-action@645d1ab48b3cb8591684a8b730b2ccf4cb3f9568 # v2
        with: { tool: cargo-fuzz }
      - name: fuzz ${{ matrix.target }} for 10 minutes
        run: |
          set -o pipefail
          cd fuzz
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=600 2>&1 | tee fuzz.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          overwrite: true
          name: evidence-fuzz-${{ matrix.target }}
          path: fuzz/fuzz.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: nightly, components: miri }
      - name: miri on the deterministic core (few property cases; the interpreter is slow)
        run: cargo +nightly miri test -p lattice-abi -p lattice-core --lib
        env:
          PROPTEST_CASES: "4"
          MIRIFLAGS: "-Zmiri-strict-provenance -Zmiri-disable-isolation"
  asan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: nightly, components: rust-src }
      - name: AddressSanitizer (memory errors and leaks) over the unit and simulator tests
        run: >
          cargo +nightly test -p lattice-abi -p lattice-core -p lattice-sim --lib
          --target x86_64-unknown-linux-gnu -Zbuild-std &&
          cargo +nightly test -p lattice-testkit --test scrub --test kernel_lifecycle --test power_cut_sweep
          --test convergence --test fuzz_lite --target x86_64-unknown-linux-gnu -Zbuild-std
        env:
          RUSTFLAGS: "-Zsanitizer=address"
          PROPTEST_CASES: "200"
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: 1.99.1 }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: benchmarks against the ci-ubuntu baseline (a shared runner is noisy, so only a 3x slowdown fails)
        run: cargo run -q --release -p lattice-bench --bin bench_runner -- --profile ci-ubuntu --scale 5 --tolerance 2.0 --ledger target/evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          overwrite: true
          name: evidence-bench
          path: target/evidence/
          if-no-files-found: warn
  config-formats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: 1.99.1 }
      - run: cargo xtask check-config-formats
  tlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: "21" }
      - name: fetch tla2tools 1.7.4 (checksum pinned) and check every model
        run: |
          curl -sSL -o tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  tla2tools.jar" | sha256sum --check
          TLA2TOOLS=$PWD/tla2tools.jar tla/check-all.sh
  scorecard:
    # Collection does not change any producer's exit status or gate volumes.
    if: always()
    needs: [sim, determinism-and-planted-bugs, fuzz, miri, asan, bench, config-formats, tlc]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    concurrency:
      group: scorecard-history-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: 1.99.1 }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: evidence-*
          path: target/observations
      - name: build ledger CLI and test scorecard ingestion
        run: |
          cargo build -q -p lattice-cli
          python3 -m unittest discover -s tools -p 'test_scorecard.py'
      - name: fetch retained history and immutable job metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target/scorecard target/history
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > target/current-run.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > target/job-pages.json
          jq '{jobs: [.[].jobs[]]}' target/job-pages.json > target/jobs.json
          # Retention is bounded. No artifact is evidence of missing earlier history.
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=scorecard-history&per_page=100" > target/artifacts.json
          previous=$(jq -r --arg branch "$GITHUB_REF_NAME" --arg run "$GITHUB_RUN_ID" \
            '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == $branch and (.workflow_run.id | tostring) != $run)] | first | .id // empty' target/artifacts.json)
          if [ -n "$previous" ]; then
            previous_run=$(jq -r --arg id "$previous" '.artifacts[] | select((.id | tostring) == $id) | .workflow_run.id' target/artifacts.json)
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$previous_run" > target/previous-run.json
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$previous/zip" > target/history.zip
            python3 tools/scorecard.py restore-history --archive target/history.zip --output target/history/history.json \
              --run-metadata target/previous-run.json --current-metadata target/current-run.json \
              --repository "$GITHUB_REPOSITORY" --branch "$GITHUB_REF_NAME" --artifact-id "$previous"
          fi
      - name: ingest observed results and render unsigned scorecard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/scorecard.py ingest --lattice "$PWD/target/debug/lattice" \
            --ledger target/scorecard-ledger --history target/history/history.json \
            --history-provenance target/history/history-provenance.json \
            --jobs target/jobs.json --artifacts target/observations --repository "$GITHUB_REPOSITORY" \
            --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --revision "$GITHUB_SHA"
          python3 tools/scorecard_metrics.py ingest-weekly --lattice "$PWD/target/debug/lattice" \
            --ledger target/scorecard-ledger --repository "$GITHUB_REPOSITORY" --branch "$GITHUB_REF_NAME"
          python3 tools/scorecard.py report --lattice "$PWD/target/debug/lattice" \
            --ledger target/scorecard-ledger --output target/scorecard --producer target/current-run.json
          cat target/scorecard/scorecard.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          overwrite: true
          name: scorecard-history
          path: target/scorecard/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          overwrite: true
          name: scorecard-ledger
          path: |
            target/scorecard-ledger/
            target/jobs.json
          if-no-files-found: warn
          retention-days: 90

name: nightly
on:
  schedule: [{ cron: "0 2 * * *" }]
  workflow_dispatch:
    inputs:
      sql_proptest:
        description: "Run the lattice-sql property tests at 1,000,000 cases (unmeasured; the schedule does not)"
        required: false
        default: false
        type: boolean
permissions:
  contents: read
env:
  CI: "true"
jobs:
  sim:
    strategy:
      fail-fast: false
      matrix:
        profile: [clean, crash-heavy, disk-faulty, hostile, everything]
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: 1.99.1 }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: simulation, ${{ matrix.profile }}, 250,000 seeds (1,000,000 per profile across the shards)
        # The seed window moves every day, so a night never repeats the one before.
        run: |
          day=$(( $(date -u +%s) / 86400 ))
          from=$(( day * 1000000 + ${{ matrix.shard }} * 250000 ))
          echo "seeds $from to $(( from + 249999 ))"
          mkdir -p target/evidence
          cargo run -q --release -p lattice-testkit --bin sim_runner -- \
            --seeds 250000 --steps 150 --from "$from" --profile ${{ matrix.profile }} --ledger target/evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          overwrite: true
          name: evidence-sim-${{ matrix.profile }}-${{ matrix.shard }}
          path: target/evidence/
          if-no-files-found: warn
  determinism-and-planted-bugs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: 1.99.1 }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: planted-bug detection and determinism self-check
        run: cargo test -p lattice-testkit --release
      - name: gate-volume tests (determinism over 10,000 seeds per profile; 100 exhaustively swept workloads)
        run: cargo test -p lattice-testkit --release --test clean_build --test power_cut_sweep -- --ignored
      - name: property tests at 1,000,000 cases (CRDT laws, codecs, clock)
        run: cargo test -p lattice-core -p lattice-abi -p lattice-lsl --release
        env:
          PROPTEST_CASES: "1000000"
  proptest-sql:
    # The SQL print/parse round-trip properties at 1,000,000 cases. Manual dispatch only until a run
    # has measured the time: a timeout here would turn the scheduled night red. TODO: after a dispatch
    # fits well inside the budget, drop the `if` and let it run nightly. lattice-engines is not
    # included: its model_based and managed_indexes properties open real stores and write files for
    # every case, an estimate of hours that has not been measured.
    if: inputs.sql_proptest == true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: 1.99.1 }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: SQL property tests at 1,000,000 cases
        run: cargo test -p lattice-sql --release
        env:
          PROPTEST_CASES: "1000000"
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target: [changeset_decode, id_parse, log_open, lsl_parse, pgwire, sql_parse, wal_record, row_ops, catalog_decode, typed_row_decode, sync_frame, plugin_jsonl, feed_decode, mcp_message, outbox_decode, crdt_text_decode, crdt_tree_decode, conflict_decode]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: nightly-2026-10-27 }
      - uses: taiki-e/install-action@645d1ab48b3cb8591684a8b730b2ccf4cb3f9568 # v2.87.33
        with: { tool: cargo-fuzz@0.13.2 }
      - name: fuzz ${{ matrix.target }} for 10 minutes
        run: |
          set -o pipefail
          cd fuzz
          mkdir -p corpus/${{ matrix.target }} && cargo +nightly-2026-10-27 fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} corpus/${{ matrix.target }} seeds/${{ matrix.target }} -- -max_total_time=600 2>&1 | tee fuzz.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          overwrite: true
          name: evidence-fuzz-${{ matrix.target }}
          path: fuzz/fuzz.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: nightly-2026-10-27, components: miri }
      - name: miri on deterministic core and engine libraries (few property cases; the interpreter is slow)
        run: cargo +nightly-2026-10-27 miri test -p lattice-abi -p lattice-core -p lattice-engines --lib
        env:
          PROPTEST_CASES: "4"
          MIRIFLAGS: "-Zmiri-strict-provenance -Zmiri-disable-isolation"
  asan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: nightly-2026-10-27, components: rust-src }
      - name: AddressSanitizer (memory errors and leaks) over the unit and simulator tests
        run: >
          cargo +nightly-2026-10-27 test -p lattice-abi -p lattice-core -p lattice-sim -p lattice-engines -p lattice-api --lib
          --target x86_64-unknown-linux-gnu -Zbuild-std &&
          cargo +nightly-2026-10-27 test -p lattice-testkit --test scrub --test kernel_lifecycle --test power_cut_sweep
          --test convergence --test fuzz_lite --target x86_64-unknown-linux-gnu -Zbuild-std
        env:
          RUSTFLAGS: "-Zsanitizer=address"
          PROPTEST_CASES: "200"
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: 1.99.1 }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: benchmarks against the ci-ubuntu baseline (a shared runner is noisy, so only a 3x slowdown fails)
        run: cargo run -q --release -p lattice-bench --bin bench_runner -- --profile ci-ubuntu --scale 5 --tolerance 2.0 --ledger target/evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          overwrite: true
          name: evidence-bench
          path: target/evidence/
          if-no-files-found: warn
  config-formats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: 1.99.1 }
      - run: cargo xtask check-config-formats
  tlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: "21" }
      - name: fetch tla2tools 1.7.4 (checksum pinned) and check every model
        run: |
          curl -sSL -o tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  tla2tools.jar" | sha256sum --check
          TLA2TOOLS=$PWD/tla2tools.jar tla/check-all.sh
  scorecard:
    # Collection does not change any producer's exit status or gate volumes.
    if: always()
    needs: [sim, determinism-and-planted-bugs, fuzz, miri, asan, bench, config-formats, tlc, row-faults, cancel-loom]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    concurrency:
      group: scorecard-history-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: 1.99.1 }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: evidence-*
          path: target/observations
      - name: build ledger CLI and test scorecard ingestion
        run: |
          cargo build -q -p lattice-cli
          python3 -m unittest discover -s tools -p 'test_scorecard.py'
      - name: fetch retained history and immutable job metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target/scorecard target/history
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > target/current-run.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > target/job-pages.json
          jq '{jobs: [.[].jobs[]]}' target/job-pages.json > target/jobs.json
          # Retention is bounded. No artifact is evidence of missing earlier history.
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=scorecard-history&per_page=100" > target/artifacts.json
          previous=$(jq -r --arg branch "$GITHUB_REF_NAME" --arg run "$GITHUB_RUN_ID" \
            '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == $branch and (.workflow_run.id | tostring) != $run)] | first | .id // empty' target/artifacts.json)
          if [ -n "$previous" ]; then
            previous_run=$(jq -r --arg id "$previous" '.artifacts[] | select((.id | tostring) == $id) | .workflow_run.id' target/artifacts.json)
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$previous_run" > target/previous-run.json
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$previous/zip" > target/history.zip
            python3 tools/scorecard.py restore-history --archive target/history.zip --output target/history/history.json \
              --run-metadata target/previous-run.json --current-metadata target/current-run.json \
              --repository "$GITHUB_REPOSITORY" --branch "$GITHUB_REF_NAME" --artifact-id "$previous"
          fi
      - name: ingest observed results and render unsigned scorecard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/scorecard.py ingest --lattice "$PWD/target/debug/lattice" \
            --ledger target/scorecard-ledger --history target/history/history.json \
            --history-provenance target/history/history-provenance.json \
            --jobs target/jobs.json --artifacts target/observations --repository "$GITHUB_REPOSITORY" \
            --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --revision "$GITHUB_SHA"
          python3 tools/scorecard_metrics.py ingest-weekly --lattice "$PWD/target/debug/lattice" \
            --ledger target/scorecard-ledger --repository "$GITHUB_REPOSITORY" --branch "$GITHUB_REF_NAME"
          python3 tools/scorecard.py report --lattice "$PWD/target/debug/lattice" \
            --ledger target/scorecard-ledger --output target/scorecard --producer target/current-run.json
          cat target/scorecard/scorecard.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          overwrite: true
          name: scorecard-history
          path: target/scorecard/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          overwrite: true
          name: scorecard-ledger
          path: |
            target/scorecard-ledger/
            target/jobs.json
          if-no-files-found: warn
          retention-days: 90
  sql-reference:
    # The subset scripts state what PostgreSQL answers; this keeps the expected values honest until
    # an engine runs them. Defined once in sql-reference.yml, which pull requests also use.
    uses: ./.github/workflows/sql-reference.yml
  cancel-loom:
    uses: ./.github/workflows/cancel-loom.yml

  report-failure:
    # A failed scheduled night opens one issue, or adds a comment to the one still open, naming the
    # failed jobs and the seed lines their logs print. Manual runs are not reported.
    # Every other job is listed in needs, including scorecard, so a job added later but left out of
    # the list is a review finding. A job that failed, timed out or was cancelled counts: a runner
    # that is lost mid-job reports as cancelled and would otherwise leave no issue. This workflow has
    # no concurrency group, so nothing cancels a job on purpose; a run an owner cancels by hand also
    # stops this job, and so opens nothing.
    if: always() && github.event_name == 'schedule'
    needs: [sim, determinism-and-planted-bugs, proptest-sql, fuzz, miri, asan, bench, config-formats, tlc, sql-reference, scorecard, row-faults, cancel-loom]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: open or update the nightly failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failed=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled") | .name')
          if [ -z "$failed" ]; then echo "no failed jobs"; exit 0; fi
          seeds=$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed 2>/dev/null \
            | grep -iE 'seed|scenario|invariant|panicked' | cut -c1-300 | head -20 || true)
          {
            echo "The scheduled nightly run failed: $RUN_URL"
            echo
            echo "Failed jobs:"
            while IFS= read -r job; do printf -- '- %s\n' "$job"; done <<< "$failed"
            echo
            echo "Seed, scenario and invariant lines from the failed logs (the trace is in the run's artifacts):"
            echo '```'
            echo "$seeds"
            echo '```'
            echo
            echo "Owner: whoever merged the newest commit on main before this run. Reproduce a simulation failure with the printed seed and profile through \`sim_runner\`."
          } > body.md
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label nightly-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "nightly failed on $(date -u +%F)" \
              --label nightly-failure --label "type: bug" --body-file body.md
          fi

  row-faults:
    name: row-faults (${{ matrix.profile }}, ${{ matrix.shard }})
    needs: row-fault-plan
    strategy:
      fail-fast: false
      # Bound incremental row-runner contention while retaining all forty selections.
      max-parallel: 8
      matrix:
        profile: [clean, crash-heavy, disk-faulty, hostile, everything]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: 1.99.1 }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evidence-row-fault-plan
          path: row-plan
      - name: compile the host runner with the actual row oracle
        run: |
          cargo build --release -p lattice-bench --example row_fault_runner
          sha256sum target/release/examples/row_fault_runner > row-runner.sha256
      - name: exact row-fault shard (25,000 histories, 150 steps; 1,000,000 total per night)
        env:
          ROW_PROFILE: ${{ matrix.profile }}
          ROW_SHARD: ${{ matrix.shard }}
          ROW_DAY: ${{ needs.row-fault-plan.outputs.day }}
        run: |
          set -euo pipefail
          args=(--day "$ROW_DAY" --profile "$ROW_PROFILE" --shard "$ROW_SHARD"
                --repository "$GITHUB_REPOSITORY" --run "$GITHUB_RUN_ID"
                --attempt "$GITHUB_RUN_ATTEMPT" --revision "$GITHUB_SHA")
          # Preflight the compiled entry and compare it to the complete shared campaign plan.
          target/release/examples/row_fault_runner "${args[@]}" --plan-only --output row-selection.json
          python3 - <<'PYCODE'
          import json
          plan = json.load(open('row-plan/row-fault-plan.json'))
          compiled = json.load(open('row-selection.json'))
          selected = compiled['selection']
          assert compiled['status'] == 'plan_only' and compiled['counts'] is None
          assert selected['mode'] == 'nightly_volume' and selected['planned_observed'] == 25000
          assert len(plan['shards']) == 40 and plan['total_histories'] == 1000000
          assert selected['utc_day'] == plan['utc_day'] and selected['steps'] == plan['steps'] == 150
          matches = [row for row in plan['shards'] if row['profile'] == selected['profile'] and row['shard'] == selected['shard']]
          assert len(matches) == 1
          assert all(selected[key] == matches[0][key] for key in ('from','to_exclusive','planned_observed'))
          assert all(compiled['source'][key] == plan['source'][key] for key in ('repository','run_id','revision'))
          # A failed-job retry may reuse the original successful plan job. Preserve both attempts.
          assert compiled['source']['attempt'] >= plan['source']['attempt']
          print('exact compiled selection matches complete shared plan', selected)
          PYCODE
          target/release/examples/row_fault_runner "${args[@]}" --output row-faults.json 2>&1 | tee row-faults.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          overwrite: true
          name: evidence-row-faults-${{ matrix.profile }}-${{ matrix.shard }}
          path: |
            row-plan/row-fault-plan.json
            row-selection.json
            row-runner.sha256
            row-faults.json
            row-faults.log
          if-no-files-found: warn
  row-fault-plan:
    # Capture the UTC day once. Queued shards crossing midnight must retain the same seed window.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      day: ${{ steps.plan.outputs.day }}
    steps:
      - name: freeze the exact daily million-history plan
        id: plan
        run: |
          python3 - <<'PYCODE'
          import json, os, time
          day = int(time.time()) // 86400
          base = day * 200000
          assert base + 200000 <= 2**64 - 1
          profiles = ['clean','crash-heavy','disk-faulty','hostile','everything']
          shards = [{'profile':profile,'shard':shard,'from':base+shard*25000,
                     'to_exclusive':base+(shard+1)*25000,'planned_observed':25000}
                    for profile in profiles for shard in range(8)]
          assert len(shards) == 40 and sum(row['planned_observed'] for row in shards) == 1000000
          for profile in profiles:
              rows = [row for row in shards if row['profile'] == profile]
              assert rows[0]['from'] == base and rows[-1]['to_exclusive'] == base + 200000
              assert all(left['to_exclusive'] == right['from'] for left, right in zip(rows,rows[1:]))
          plan = {'schema':1,'utc_day':day,'steps':150,'total_histories':1000000,'shards':shards,
                  'source':{'repository':os.environ['GITHUB_REPOSITORY'],'run_id':int(os.environ['GITHUB_RUN_ID']),
                            'attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'revision':os.environ['GITHUB_SHA']}}
          with open('row-fault-plan.json','w') as output: json.dump(plan,output,indent=2)
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write(f'day={day}\n')
          print(json.dumps(plan))
          PYCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: evidence-row-fault-plan
          path: row-fault-plan.json
          if-no-files-found: error

name: openssf-scorecard
# OpenSSF Scorecard: scores the repository's supply-chain practices (pinned actions, token
# permissions, branch protection, dependency updates, security policy and more) once a week and on
# every push to main. Not a pull request check and not a required check. Policy: docs/policies/openssf-scorecard.md.
# Constraints for a publishing run (the action refuses a workflow that breaks them): no top-level
# env or defaults, no workflow-level write permissions, only the action's allowed steps in the job.
on:
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: openssf-scorecard
  cancel-in-progress: false

jobs:
  analysis:
    name: scorecard analysis
    # Not on forks: the action does not support them and they have no id-token for publishing.
    if: github.repository == 'moncifem/latticedb'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload the SARIF results to the code scanning tab
      id-token: write # publish the result to the public Scorecard API (needed for the badge)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Keep the SARIF file
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 14
      - name: Upload to the code scanning tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
          category: openssf-scorecard
  notify:
    # A failed scheduled run opens or comments on one issue for this workflow (scheduled-failure.yml).
    # Schedule runs only; a job cancelled by a lost runner counts, as it does in nightly's report.
    if: always() && github.event_name == 'schedule' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    needs: [analysis]
    permissions:
      contents: read
      actions: read
      issues: write
    uses: ./.github/workflows/scheduled-failure.yml
    with:
      workflow: ${{ github.workflow }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

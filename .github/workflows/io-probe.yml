name: io-probe
# Commit-path measurements on a Linux runner's disk, the data ADR 0011 reads against its revisit
# triggers. Weekly, and on demand.
on:
  schedule: [{ cron: "0 5 * * 0" }]
  workflow_dispatch:
    inputs:
      sql_planner:
        description: Run only the isolated ADR0013 SQL planner experiment
        type: boolean
        default: false
      scorecard_source_run:
        description: "Replay retained evidence from a completed nightly run; empty runs the normal I/O probes"
        required: false
        default: ""
        type: string
permissions:
  contents: read
jobs:
  io-probe:
    if: ${{ inputs.scorecard_source_run == '' && !(github.event_name == 'workflow_dispatch' && inputs.sql_planner) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: 1.99.1 }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: commit path on the runner's disk
        run: |
          set -o pipefail
          cargo run -q --release -p lattice-bench --bin io_probe -- --commits 2000 | tee io-probe.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: io-probe
          path: io-probe.txt

  runtime-spike:
    # An explicit, bounded experiment: no scheduled run until its evidence is reviewed.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scorecard_source_run == '' && !inputs.sql_planner }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: 1.99.1, components: clippy }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { shared-key: runtime-spike }
      - uses: taiki-e/install-action@645d1ab48b3cb8591684a8b730b2ccf4cb3f9568 # v2
        with: { tool: cargo-deny }
      - name: runner I/O context
        run: |
          uname -a
          lscpu
          df -T "$RUNNER_TEMP"
          sysctl kernel.io_uring_disabled || true
      - name: feature-on lint and structural checks
        run: |
          cargo clippy -p lattice-sys -p lattice-seams -p lattice-bench --features lattice-bench/runtime-spike --all-targets -- -D warnings
          cargo xtask check-layers
          cargo xtask check-unsafe
          cargo xtask check-allow
          cargo deny --all-features check --hide-inclusion-graph
      - name: compare portable, tokio and io_uring with the real kernel
        run: |
          set -o pipefail
          cargo run --release -p lattice-bench --features runtime-spike --bin runtime_probe -- \
            --dir "$RUNNER_TEMP/lattice-runtime-probe" --commits 2000 --read-passes 20 \
            --output runtime-probe.json 2>&1 | tee runtime-probe.txt
      - name: feature-on completion error test
        run: cargo test -p lattice-sys --features uring
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: runtime-spike
          path: |
            runtime-probe.json
            runtime-probe.txt
          if-no-files-found: ignore

  scorecard-replay:
    if: github.event_name == 'workflow_dispatch' && inputs.scorecard_source_run != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: 1.99.1 }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: build only the ledger CLI and check collector regressions
        run: |
          cargo build -q -p lattice-cli
          python3 -m unittest discover -s tools -p 'test_scorecard.py'
      - name: replay original nightly artifacts with exact source provenance
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.scorecard_source_run }}
        run: |
          python3 tools/scorecard_replay.py --source-run "$SOURCE_RUN" \
            --repository "$GITHUB_REPOSITORY" --branch main --lattice "$PWD/target/debug/lattice" \
            --code-revision "$GITHUB_SHA" --output target/scorecard-replay \
            --replay-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cat target/scorecard-replay/scorecard.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scorecard-replay-${{ github.run_id }}
          path: target/scorecard-replay/
          if-no-files-found: error
          retention-days: 90

  sql-planner-spike:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.sql_planner }}
    uses: ./.github/workflows/sql-planner-spike.yml

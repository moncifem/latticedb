name: io-probe
# Commit-path measurements on a Linux runner's disk, the data ADR 0011 reads against its revisit
# triggers. Weekly, and on demand.
on:
  schedule: [{ cron: "0 5 * * 0" }]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  io-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: 1.99.1 }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: commit path on the runner's disk
        run: |
          set -o pipefail
          cargo run -q --release -p lattice-bench --bin io_probe -- --commits 2000 | tee io-probe.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: io-probe
          path: io-probe.txt

name: docs-site
# Builds the documentation site from docs/ with mdBook. Every pull request that touches the documents
# builds it and checks relative links; nothing is deployed from a pull request. A push to main also
# deploys to GitHub Pages. Deploying is skipped (green, with a notice) until the owner has enabled Pages
# (Settings, Pages, Source: GitHub Actions) and set the repository variable PAGES_ENABLED to true. A
# variable is used because it needs no token permission; the Pages REST endpoint is documented for
# classic tokens only and its GITHUB_TOKEN permission is not stated. See
# docs/site-setup.md. Uses pull_request, never pull_request_target.
on:
  pull_request:
    paths:
      - "docs/**"
      - "formats/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "tools/docs_summary.py"
      - "tools/test_docs_summary.py"
      - "tools/docs_wiki.py"
      - "tools/test_docs_wiki.py"
      - ".github/workflows/docs-site.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "formats/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "tools/docs_summary.py"
      - "tools/test_docs_summary.py"
      - "tools/docs_wiki.py"
      - "tools/test_docs_wiki.py"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned release binary. The checksum is the sha256 GitHub publishes for this asset
  # (rust-lang/mdBook release v0.5.4, mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz).
  MDBOOK_VERSION: v0.5.4
  MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide whether to deploy
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PAGES_ENABLED: ${{ vars.PAGES_ENABLED }}
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ] || [ "${REF}" != "refs/heads/main" ]; then
            echo "deploy=false" >> "${GITHUB_OUTPUT}"
          elif [ "${PAGES_ENABLED}" = "true" ]; then
            echo "deploy=true" >> "${GITHUB_OUTPUT}"
          else
            echo "deploy=false" >> "${GITHUB_OUTPUT}"
            echo "::notice title=Pages deploy skipped::The site was built but not deployed: the owner has not set the repository variable PAGES_ENABLED=true. See docs/site-setup.md."
          fi
      - name: Tests for the staging and wiki scripts
        run: python3 -m unittest discover -s tools -p 'test_docs_*.py'
      - name: Install mdBook (pinned release, checksum verified)
        run: |
          set -euo pipefail
          archive="mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/${archive}"
          echo "${MDBOOK_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict -
          mkdir -p "${RUNNER_TEMP}/mdbook-bin"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/mdbook-bin" mdbook
          echo "${RUNNER_TEMP}/mdbook-bin" >> "${GITHUB_PATH}"
      - name: Stage docs, generate SUMMARY.md and check relative links
        run: python3 tools/docs_summary.py --out target/docs-src
      - name: Generate the wiki pages (checks their links against the real docs)
        run: python3 tools/docs_wiki.py --out "${RUNNER_TEMP}/wiki-check"
      - name: Build the site
        run: |
          mdbook --version
          mdbook build docs --dest-dir "${GITHUB_WORKSPACE}/target/docs-book"
          test -f target/docs-book/index.html
      - name: Upload the Pages artifact
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/docs-book

  deploy:
    name: deploy
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish the artifact to GitHub Pages
      id-token: write # deploy-pages verifies the deployment source with an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

name: bench-baseline
# Records the reference benchmark baseline for the `ci-ubuntu` profile on a GitHub-hosted runner.
# Run it by hand, download the artifact and commit it under benches/baselines/ci-ubuntu/.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: 1.99.1 }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo run -q --release -p lattice-bench --bin bench_runner -- --profile ci-ubuntu --scale 5 --write-baseline
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-baseline-ci-ubuntu
          path: benches/baselines/ci-ubuntu/baseline.json

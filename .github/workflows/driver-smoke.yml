name: driver-smoke
# Runs the node-postgres (pg), pgx and pg8000 smoke scripts in tests/drivers (text mode) against the
# release-built latticed over loopback trust (issues 576 and 710). Each driver is installed from its lockfile
# or hash-pinned requirements: package-lock.json for node, go.sum for Go, requirements.txt (--require-hashes)
# for Python. The expected output is written by hand; a case that latticed does not pass yet is pinned in
# known.jsonl with its issue, and the job fails when that case changes or starts to match PostgreSQL. This is
# not the driver matrix (#413), which also covers the binary formats.
on:
  pull_request:
    paths:
      - "crates/latticed/**"
      - "crates/lattice-api/**"
      - "crates/lattice-exec/**"
      - "tests/drivers/**"
      - "Cargo.lock"
      - ".github/workflows/driver-smoke.yml"
  push:
    branches: [main]
    paths:
      - "crates/latticed/**"
      - "crates/lattice-api/**"
      - "crates/lattice-exec/**"
      - "tests/drivers/**"
      - "Cargo.lock"
      - ".github/workflows/driver-smoke.yml"
  workflow_dispatch:
  schedule: [{ cron: "20 6 * * 1" }]
permissions:
  contents: read
concurrency:
  group: driver-smoke-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  driver-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: 1.99.1 }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: build latticed
        run: cargo build --release --locked -p latticed
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: install the node-postgres driver from package-lock.json
        run: npm ci --ignore-scripts
        working-directory: tests/drivers/node
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/drivers/go/go.mod
          cache-dependency-path: tests/drivers/go/go.sum
      - name: download the pgx driver pinned in go.sum
        run: go mod download
        working-directory: tests/drivers/go
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: install the pg8000 driver from requirements.txt, hashes checked
        run: python3 -m pip install --require-hashes --no-deps -r requirements.txt
        working-directory: tests/drivers/python
      - name: shellcheck
        run: shellcheck -x tests/drivers/smoke.sh
      - name: driver smoke scripts, text mode
        env:
          LATTICE_DRIVERS_WORK: ${{ runner.temp }}/driver-smoke
        run: tests/drivers/smoke.sh target/release/latticed
      - name: driver versions
        if: always()
        run: |
          {
            echo "### driver smoke scripts"
            echo
            echo "- node-postgres: \`$(cd tests/drivers/node && node -p 'require("pg/package.json").version')\` on node \`$(node --version)\`"
            echo "- pgx: \`$(cd tests/drivers/go && go list -m -f '{{.Version}}' github.com/jackc/pgx/v5)\` on \`$(go version)\`"
            echo "- pg8000: \`$(python3 -c 'import importlib.metadata as m; print(m.version("pg8000"))')\` on \`$(python3 --version)\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: server logs and driver output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: driver-smoke-logs
          path: |
            ${{ runner.temp }}/driver-smoke/*/server.log
            ${{ runner.temp }}/driver-smoke/*/driver.stderr
            ${{ runner.temp }}/driver-smoke/*/actual.jsonl
          if-no-files-found: ignore
          retention-days: 7
  notify:
    # A failed scheduled run opens or comments on one issue for this workflow (scheduled-failure.yml).
    # Schedule runs only; a job cancelled by a lost runner counts, as it does in nightly's report.
    if: always() && github.event_name == 'schedule' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    needs: [driver-smoke]
    permissions:
      contents: read
      actions: read
      issues: write
    uses: ./.github/workflows/scheduled-failure.yml
    with:
      workflow: ${{ github.workflow }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

name: release
# A release is a tag. Push vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-alpha.N / -rc.N: versions with a
# suffix are published as pre-releases. Run it by hand to rehearse the build without publishing.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: 1.99.1 }
      - id: v
        name: the workspace version is the single source of truth
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name=="lattice-cli") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            [ "${GITHUB_REF_NAME}" = "v$version" ] \
              || { echo "tag ${GITHUB_REF_NAME} does not match workspace version $version" >&2; exit 1; }
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
              || { echo "the tagged commit is not on main" >&2; exit 1; }
          fi
          grep -q "^## \[$version\]" CHANGELOG.md \
            || { echo "CHANGELOG.md has no section for $version" >&2; exit 1; }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: the release commit passes the full gate
        run: cargo xtask ci
        env: { CI: "true" }
  package:
    needs: verify
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.verify.outputs.version }}
      channel: release
      publish: ${{ github.ref_type == 'tag' }}
      ref: ${{ github.sha }}

name: fuzz-24h
# Gate row E1-6: at least 24 hours of fuzzing per target. One job is capped at six hours, so each
# target runs as five parallel shards with different seeds; the cumulative fuzzing time per target is
# 5 x 5h40m = 28h20m. Run it by hand. Crashing inputs are kept as artifacts and corpora are cached.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    name: fuzz (${{ matrix.target }}, shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        target: [changeset_decode, id_parse, log_open, lsl_parse, pgwire, sql_parse, wal_record, row_ops, catalog_decode, typed_row_decode, sync_frame, plugin_jsonl, feed_decode, mcp_message, outbox_decode, crdt_text_decode, crdt_tree_decode, conflict_decode, websocket_frame]
        shard: [1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: nightly-2026-10-27 }
      - uses: taiki-e/install-action@645d1ab48b3cb8591684a8b730b2ccf4cb3f9568 # v2.87.33
        with: { tool: cargo-fuzz@0.13.2 }
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          # Scoped to the branch: a dispatch from another branch cannot seed this corpus.
          key: fuzz-24h-corpus-${{ github.ref_name }}-${{ matrix.target }}-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: fuzz-24h-corpus-${{ github.ref_name }}-${{ matrix.target }}-${{ matrix.shard }}-
      - name: fuzz ${{ matrix.target }} shard ${{ matrix.shard }} for 5h40m
        run: |
          cd fuzz && mkdir -p corpus/${{ matrix.target }} && cargo +nightly-2026-10-27 fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} corpus/${{ matrix.target }} seeds/${{ matrix.target }} -- \
            -max_total_time=20400 -seed=$((${{ matrix.shard }} * 7919))
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crash-${{ matrix.target }}-${{ matrix.shard }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

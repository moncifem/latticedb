name: pr
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  CI: "true"
concurrency:
  group: pr-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gate:
    name: gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # One platform runs the whole gate. ARM runs the portable tests, because formatting, lint,
          # licence and document checks and the minutes-long simulation tests do not depend on the
          # operating system. macOS runs after a merge (see `gate-macos`): its runners queue for
          # minutes, so it does not hold up pull requests.
          - { os: ubuntu-latest, command: "cargo xtask ci", cases: "10000" }
          - { os: ubuntu-24.04-arm, command: "cargo xtask test-portable", cases: "256" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@645d1ab48b3cb8591684a8b730b2ccf4cb3f9568 # v2.87.33
        with:
          tool: cargo-deny@0.20.2
      - name: engine without row features
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy -p lattice-engines --no-default-features --all-targets -- -D warnings
      - run: ${{ matrix.command }}
        env:
          PROPTEST_CASES: ${{ matrix.cases }}
      - name: scorecard evidence semantics and real ledger ingestion
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo build -q -p lattice-cli
          python3 -m unittest discover -s tools -p 'test_scorecard.py'
  gate-macos:
    # Not part of the pull request gate: macOS runners queue for minutes. It runs on every push to
    # main, so a macOS-only failure is caught right after the merge.
    name: gate (macos-latest)
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo xtask test-portable
  fuzz-build:
    # A broken fuzz target would otherwise first fail at 02:00 UTC. This compiles every target on the
    # pinned stable toolchain (no sanitizer, no fuzzing run) and checks the scheduled matrices list them all.
    name: fuzz-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fuzz
          shared-key: fuzz-build
      - name: every fuzz target is in the nightly, weekly and 24-hour matrices
        run: |
          python3 tools/check_fuzz_matrices.py
          python3 -m unittest discover -s tools -p 'test_check_fuzz_matrices.py'
      - name: build every fuzz target
        run: cargo check --manifest-path fuzz/Cargo.toml --bins --locked
  secrets:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@645d1ab48b3cb8591684a8b730b2ccf4cb3f9568 # v2.87.33
        with:
          tool: typos
      - run: typos
  commits:
    name: commit-messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - name: lint every commit subject in the PR
        run: |
          # The checkout is a synthetic merge commit; lint the PR's own commits only.
          for sha in $(git rev-list --no-merges "origin/${GITHUB_BASE_REF}..HEAD"); do
            git log -1 --format=%B "$sha" > /tmp/msg
            cargo xtask commit-lint /tmp/msg
          done
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - run: cargo check --workspace

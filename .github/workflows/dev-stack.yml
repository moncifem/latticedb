name: dev-stack
# Runs tests/dev/dev-stack.sh on the runner's Docker daemon: the published image, compose v2, SCRAM over
# TLS and libpq, driven through dev/lattice-dev.sh. The script picks its own compose project, state dir
# and loopback port, so it does not touch a stack on the runner. Not a required check yet (#737).
on:
  pull_request:
    paths:
      - "dev/**"
      - "tests/dev/**"
      - "docker/**"
      - ".github/workflows/dev-stack.yml"
  push:
    branches: [main]
    paths:
      - "dev/**"
      - "tests/dev/**"
      - "docker/**"
      - ".github/workflows/dev-stack.yml"

permissions:
  contents: read

concurrency:
  group: dev-stack-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  dev-stack:
    name: dev-stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: psql client
        run: |
          command -v psql >/dev/null || {
            sudo apt-get update -q
            sudo apt-get install -y -q postgresql-client
          }
          psql --version
      - name: dev stack end to end
        # The gateway steps (6d) run on the nightly image. That image is rebuilt daily from main; until a
        # build includes the TLS gateway, the test prints a skip with its reason and the rest still runs.
        env:
          LATTICE_DEV_IMAGE: ghcr.io/moncifem/latticedb:nightly
        run: bash tests/dev/dev-stack.sh

name: package
# Builds the release archives and the container image. Called by the nightly channel and by tagged
# releases; with publish=false it only builds, which is how a release is rehearsed.
on:
  workflow_call:
    inputs:
      version:
        description: "Archive and image version label, such as 0.1.0-alpha.1 or nightly"
        required: true
        type: string
      channel:
        description: "nightly, or release"
        required: true
        type: string
      publish:
        required: true
        type: boolean
      ref:
        description: "The exact commit to build and publish; every job checks out this one"
        required: true
        type: string
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: never
jobs:
  binaries:
    strategy:
      fail-fast: true
      matrix:
        include:
          # Linux archives are built on the oldest hosted runner images (Ubuntu 22.04, glibc 2.35) so
          # they also load on Debian 12 (glibc 2.36). A binary needs the glibc of the machine that
          # linked it, so building on ubuntu-latest (24.04, glibc 2.39) would exclude both.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, arch: amd64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, arch: arm64 }
          - { os: macos-latest, target: aarch64-apple-darwin, arch: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.ref }}", persist-credentials: false }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: 1.99.1 }
      # Release archives are built from an empty cache (nightly and rehearsals keep the speed-up).
      - if: inputs.channel != 'release'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: build
        run: cargo build --release --locked -p lattice-cli -p latticed
      - name: smoke test the built binaries
        run: |
          target/release/lattice --version
          target/release/latticed --version
      - name: record the glibc version the binaries need
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # Highest versioned glibc symbol either binary imports: the minimum glibc that can load them.
          need=$(objdump -T target/release/lattice target/release/latticed \
            | grep -o 'GLIBC_[0-9][0-9.]*' | sort -uV | tail -1)
          test -n "$need" || { echo "no GLIBC_ symbol versions found" >&2; exit 1; }
          echo "$TARGET needs $need"
          echo "Minimum glibc for $TARGET: \`$need\`" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p glibc-out
          echo "$TARGET ${need#GLIBC_}" > "glibc-out/$TARGET.txt"
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: glibc-${{ matrix.target }}
          path: glibc-out/*.txt
          if-no-files-found: error
      - name: stage and archive
        env:
          NAME: lattice-${{ inputs.version }}-${{ matrix.target }}
        run: |
          mkdir -p "dist/$NAME" bin-out
          cp target/release/lattice target/release/latticed LICENSE NOTICE README.md "dist/$NAME/"
          tar -czf "dist/$NAME.tar.gz" -C dist "$NAME"
          mkdir -p "bin-out/${{ matrix.arch }}"
          cp target/release/lattice target/release/latticed "bin-out/${{ matrix.arch }}/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.arch }}
          path: bin-out/${{ matrix.arch }}
          if-no-files-found: error

  # The archive, not the build tree, is what users get: unpack it and run it where the oldest
  # supported systems run. Images are pinned by the digest of their multi-architecture index
  # (resolved 2026-10-30: debian:12 is Debian 12 bookworm, glibc 2.36; ubuntu:22.04 is glibc 2.35).
  archive_runs_on_debian_12_and_ubuntu_22_04:
    needs: binaries
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm]
        image:
          - debian:12@sha256:d74df7598108a173a621eda4d58a2adbf850b2d9a9d81bc2cca1a6c21174a880
          - ubuntu:22.04@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archive-${{ matrix.target }}
          path: dist
      - name: unpack the archive
        run: |
          mkdir unpacked
          tar -xzf dist/*.tar.gz -C unpacked
          ls -l unpacked/*/
      - name: run both binaries in the container
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm --volume "$PWD/unpacked:/archive:ro" "$IMAGE" sh -c '
            set -eu
            . /etc/os-release
            echo "running on $PRETTY_NAME"
            for dir in /archive/lattice-*/; do
              "${dir}lattice" --version
              "${dir}latticed" --version
            done'

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.ref }}", persist-credentials: false }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: 1.99.1 }
      - uses: taiki-e/install-action@645d1ab48b3cb8591684a8b730b2ccf4cb3f9568 # v2.87.33
        with: { tool: cargo-cyclonedx@0.5.9 }
      - name: generate
        run: |
          cargo cyclonedx --format json
          mkdir -p sbom
          cp crates/latticed/latticed.cdx.json crates/lattice-cli/lattice-cli.cdx.json sbom/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/*.json
          if-no-files-found: error

  release:
    if: inputs.publish
    needs: [binaries, sbom, archive_runs_on_debian_12_and_ubuntu_22_04]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.ref }}", persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{archive-*,sbom}"
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "glibc-*"
          path: glibc
          merge-multiple: true
      - name: checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz *.json > SHA256SUMS
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*.tar.gz
      - name: release notes
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          SHA: ${{ inputs.ref }}
        run: |
          if [ "$CHANNEL" = nightly ]; then
            {
              echo "Automated build of \`main\` at ${SHA}. Unsupported; the format may change without notice."
              echo
              echo "Verify a download with \`gh attestation verify <file> --repo ${{ github.repository }}\`."
            } > notes.md
          else
            awk -v v="$VERSION" '
              $0 ~ "^## \\[" v "\\]" { on = 1; next }
              on && /^## \[/ { exit }
              on { print }
            ' CHANGELOG.md > notes.md
            test -s notes.md || { echo "CHANGELOG.md has no section for $VERSION" >&2; exit 1; }
          fi
      - name: state the minimum glibc in the release notes
        run: |
          {
            echo
            echo "Linux archives are built on Ubuntu 22.04 and need at least this glibc (measured from the binaries' symbol versions):"
            echo
            for f in glibc/*.txt; do
              read -r target need < "$f"
              echo "- \`$target\`: glibc $need"
            done
          } >> notes.md
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          TAG: ${{ github.ref_name }}
          INPUTS_REF: ${{ inputs.ref }}
        run: |
          if [ "$CHANNEL" = nightly ]; then
            gh release delete nightly --cleanup-tag --yes || true
            gh release create nightly dist/* --target "${INPUTS_REF}" --prerelease \
              --title "Nightly build" --notes-file notes.md
          else
            flag=""
            case "$VERSION" in *-*) flag="--prerelease" ;; esac
            gh release create "$TAG" dist/* --verify-tag $flag \
              --title "Lattice $VERSION" --notes-file notes.md
          fi

  image:
    if: inputs.publish
    needs: [binaries, sbom, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.ref }}", persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "bin-{amd64,arm64}"
          path: bin
      - name: layout the build context
        run: |
          mv bin/bin-amd64 bin/amd64
          mv bin/bin-arm64 bin/arm64
          chmod +x bin/*/*
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: latest
        name: only the highest stable version moves the latest tag
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          is_latest=false
          case "$VERSION" in
            *-*) ;;
            *)
              if [ "$CHANNEL" = release ]; then
                highest=$(git ls-remote --tags --refs origin 'refs/tags/v[0-9]*' \
                  | sed 's#.*refs/tags/v##' | grep -v -- - | sort -V | tail -1)
                [ "$highest" = "$VERSION" ] && is_latest=true
              fi ;;
          esac
          echo "is_latest=$is_latest" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=nightly,enable=${{ inputs.channel == 'nightly' }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.channel == 'release' }}
            type=raw,value=latest,enable=${{ steps.latest.outputs.is_latest == 'true' }}
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}
      - id: push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

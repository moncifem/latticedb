name: image-smoke
# Builds the container image for the runner architecture from binaries built in this job, then runs
# tests/image/smoke.sh against it: a usage error with no arguments, the non-root user and volume
# ownership, credentials from `lattice account` inside the image, SCRAM over TLS on port 5432 with
# psql sslmode=verify-full, a clean `docker stop`, and rows read back after a restart on the same
# volumes. The package workflow builds the multi-architecture image for release but does not run it.
#
# Not a release proof: this job builds the binaries on ubuntu-24.04 (glibc 2.39). The release archives
# are built on ubuntu-22.04 (glibc 2.35, see package.yml), so a pass here does not show that the release
# binaries run in this image. It tests the image built from the same source on the same base.
on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker/**"
      - "tests/image/**"
      - "crates/latticed/**"
      - "crates/lattice-cli/**"
      - "crates/lattice-api/**"
      - "crates/lattice-exec/**"
      - "crates/lattice-engines/**"
      - "crates/lattice-sys/**"
      - "crates/lattice-core/**"
      - "crates/lattice-seams/**"
      - "Cargo.lock"
      - ".github/workflows/image-smoke.yml"
  workflow_dispatch:
  schedule: [{ cron: "20 6 * * 1" }]
permissions: {}
concurrency:
  group: image-smoke-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  image-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: 1.99.1 }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: build the binaries
        run: cargo build --release --locked -p lattice-cli -p latticed
      - name: lay out the build context for the runner architecture
        run: |
          # The package workflow builds the arm64 image; this job runs the image the runner can execute.
          test "$(uname -m)" = x86_64 || { echo "runner is not x86_64" >&2; exit 1; }
          mkdir -p bin/amd64
          cp target/release/lattice target/release/latticed bin/amd64/
      - name: build the image
        env:
          DOCKER_BUILDKIT: "1"
        run: docker build --build-arg TARGETARCH=amd64 -t lattice-smoke:ci .
      - name: install the psql client
        run: |
          command -v psql >/dev/null || {
            sudo apt-get update -q
            sudo apt-get install -y -q postgresql-client
          }
          psql --version
      - name: lint the smoke test and the entrypoint
        run: shellcheck tests/image/smoke.sh docker/entrypoint.sh
      - name: smoke test the image
        env:
          IMAGE: lattice-smoke:ci
          WORK: ${{ runner.temp }}/image-smoke-work
        run: tests/image/smoke.sh "$IMAGE" "$WORK"
      - name: upload the container logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-smoke-logs
          path: ${{ runner.temp }}/image-smoke-work/image-smoke/logs/*.log
          if-no-files-found: ignore
          retention-days: 7
  notify:
    # A failed scheduled run opens or comments on one issue for this workflow (scheduled-failure.yml).
    # Schedule runs only; a job cancelled by a lost runner counts, as it does in nightly's report.
    if: always() && github.event_name == 'schedule' && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    needs: [image-smoke]
    permissions:
      contents: read
      actions: read
      issues: write
    uses: ./.github/workflows/scheduled-failure.yml
    with:
      workflow: ${{ github.workflow }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

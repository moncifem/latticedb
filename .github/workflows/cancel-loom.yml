name: cancel-loom
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - 'crates/lattice-api/**'
      - 'crates/lattice-seams/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tools/cancel-loom/**'
      - '.github/workflows/cancel-loom.yml'
permissions:
  contents: read
# Pull requests cancel their superseded runs. Other callers (nightly.yml) get a unique group, so they never wait or cancel.
concurrency:
  group: cancel-loom-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  cancel-loom:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTFLAGS: '--cfg loom'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: 1.99.1 }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { shared-key: cancel-loom }
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with: { tool: cargo-deny@0.20.2 }
      - name: Audit isolated test-tool dependencies
        run: cargo deny --locked --manifest-path tools/cancel-loom/Cargo.toml --config tools/cancel-loom/deny.toml check
      - name: Verify four models are selected, then enumerate their interleavings
        run: |
          set -euo pipefail
          cargo test --manifest-path tools/cancel-loom/Cargo.toml --locked --test cancel_loom -- --list > cancel-loom-selection.txt
          test "$(grep -c ': test$' cancel-loom-selection.txt)" -eq 4
          cargo test --manifest-path tools/cancel-loom/Cargo.toml --locked --test cancel_loom -- --nocapture 2>&1 | tee cancel-loom.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidence-cancel-loom
          path: |
            cancel-loom-selection.txt
            cancel-loom.log
          if-no-files-found: error

# BA is the business analyst role in diagrams; abd and ba appear in test fixtures; tru, fals and nulll are
# deliberately invalid JSON literals in the PostgreSQL reference checks; hel is the expected result of
# left('hello', -2) in the string function checks.
[default.extend-words]
BA = "BA"
ba = "ba"
abd = "abd"
tru = "tru"
fals = "fals"
nulll = "nulll"
hel = "hel"

[files]
extend-exclude = ["Cargo.lock", "fuzz/Cargo.lock", "LICENSE"]

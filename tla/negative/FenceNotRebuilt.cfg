\* Recovery does not rebuild the current turn from the log (kernel planted bug FenceNotRebuilt): after a
\* crash the writer is back at turn 0. TLC must report AcceptOnlyCurrent violated.
\* Trace: Begin -> log = <<begin 1>>; Crash; Recover -> cur = 0 (not 1); Write(0) is accepted ->
\* log = <<begin 1, write 0>>, but the highest turn begun before position 2 is 1.
SPECIFICATION Spec
CONSTANTS MaxTurn = 3 MaxLog = 5 FenceIgnored = FALSE FenceNotRebuilt = TRUE
INVARIANT AcceptOnlyCurrent
CHECK_DEADLOCK FALSE

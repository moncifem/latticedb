\* Undo and redo are removed (Reorder = FALSE): a replica applies an operation in the order it arrives. TLC must
\* report MatchesSerial violated, checked on its own so Convergent is not what fails.
\* Trace: replica 1 creates (ts 1, n1 under Root); replica 2 creates (ts 2, n1 under Trash); replica 2 then
\* receives ts 1 and applies it last, so its tree has n1 under Root while the replay of its log in timestamp
\* order ends with n1 under Trash.
SPECIFICATION Spec
CONSTANTS Nodes = {n1, n2, n3} Root = root Trash = trash None = none MaxTs = 4 MaxDepth = 2
          CheckCycles = TRUE CheckDepth = TRUE Reorder = FALSE CheckParent = TRUE
INVARIANT MatchesSerial
CHECK_DEADLOCK FALSE

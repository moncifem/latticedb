\* The tombstone rule is removed: an add that arrives after the remove of its tag is applied. TLC must
\* report Convergent violated.
\* Trace: Create(1, add t1); Apply(1, add t1); Create(1, rem t1) (replica 1 has applied the add);
\* Apply(1, rem t1) -> members[1] = {}; Apply(2, rem t1) -> members[2] = {}; Apply(2, add t1) ->
\* members[2] = {t1}. Both replicas have applied {add t1, rem t1}, but members[1] = {} and
\* members[2] = {t1}.
SPECIFICATION Spec
CONSTANT Tags = {t1, t2}
CONSTANT Tombstones = FALSE
INVARIANT Convergent
CHECK_DEADLOCK FALSE

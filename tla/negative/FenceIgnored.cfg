\* The fence check is removed: a write is accepted whatever turn it carries (kernel planted bug
\* FenceIgnored). TLC must report AcceptOnlyCurrent violated.
\* Shortest trace: Begin -> log = <<begin 1>>, cur = 1; Write(0) is accepted -> log = <<begin 1, write 0>>,
\* and the highest turn begun before position 2 is 1, not 0.
SPECIFICATION Spec
CONSTANTS MaxTurn = 3 MaxLog = 5 FenceIgnored = TRUE FenceNotRebuilt = FALSE
INVARIANT AcceptOnlyCurrent
CHECK_DEADLOCK FALSE

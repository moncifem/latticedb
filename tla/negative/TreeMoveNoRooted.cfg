\* The known-parent rule is removed (CheckParent = FALSE): a move under a node that is not in the tree yet
\* takes effect. TLC must report Rooted violated.
\* Trace: replica 1 creates the move (ts 1, n1 under n2) while n2 has no parent, so n1 hangs from a node that
\* reaches neither Root nor Trash. The cycle and depth rules stay on and do not refuse it (n2 has no ancestor).
SPECIFICATION Spec
CONSTANTS Nodes = {n1, n2, n3} Root = root Trash = trash None = none MaxTs = 4 MaxDepth = 2
          CheckCycles = TRUE CheckDepth = TRUE Reorder = TRUE CheckParent = FALSE
INVARIANT Rooted
CHECK_DEADLOCK FALSE

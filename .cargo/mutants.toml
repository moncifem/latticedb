# Mutants that cannot change behaviour. Each entry says why.
exclude_re = [
    # A buffer shorter than a record header always fails the field reads below the guard, so the
    # guard is redundant with them.
    "replace match guard e <= buf.len\\(\\) with true in decode_record",
    # The operands of these `|` never share a set bit (a shifted field and the bits below it), so `^`
    # gives the same result.
    "replace \\| with \\^ in Id<T>::from_parts",
    "replace \\| with \\^ in Id<T>::parse",
    # `Silent` already returns an empty list, so replacing its body with one changes nothing.
    "replace <impl Provider for Silent>::predict -> Vec<String> with vec!\\[\\]",
    # `clean()` is `Self::default()`, so replacing its body with the default changes nothing.
    "replace FaultProfile::clean -> Self with Default::default\\(\\)",
    # In `prf`, F1 is zero whenever either precision or recall is zero, so testing "both are zero" or
    # "either is zero" before the formula gives the same number. The denominator is not excluded:
    # replacing its `+` gives F1 = 2 for a perfect result and is caught.
    "replace && with \\|\\| in prf",
    # In `LwwRegister::set` the tie-break `value > *v` only matters when the value differs. With equal
    # timestamps and equal values, `>=` rewrites the same pair over itself and the state is identical.
    # The first comparison (`at > *t`) is not excluded: its `>=` lets a smaller value win a tie, and a
    # test catches it.
    "crdt\\.rs:\\d+:64: replace > with >= in LwwRegister<T>::set",
]

# The benchmark bodies choose iteration counts and time loops; their output is a timing, which varies
# by machine, so no test can pin it. This also means a change to what a benchmark measures goes
# unnoticed by mutation testing; the nightly gate against a recorded baseline is what watches that. A
# separate test checks that every benchmark reports a positive, finite time.
exclude_globs = ["crates/lattice-bench/src/suite.rs"]

# Standalone concurrency-test tool only; workspace deny.toml remains authoritative for shipped crates.
[advisories]
version = 2
yanked = "deny"
[licenses]
version = 2
allow = ["Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "Apache-2.0 WITH LLVM-exception"]
[bans]
multiple-versions = "warn"
deny = [{ name = "openssl" }, { name = "openssl-sys" }]
